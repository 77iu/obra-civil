  <!-- #region consultas -->
   <section class="consultas-section">
      <div class="form-container">
        <h2>Consultas</h2>
        <form id="consultaForm">
          <div class="form-row">
            <div class="form-group">
              <label for="nombre">Nombre</label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                required
                placeholder="Ej. Juan"
              />
            </div>
            <div class="form-group">
              <label for="apellido">Apellido</label>
              <input
                type="text"
                id="apellido"
                name="apellido"
                required
                placeholder="Ej. Pérez"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="juanperez@email.com"
            />
          </div>

          <div class="form-group">
            <label for="provincia">Provincia</label>
            <select id="provincia" name="provincia" required>
              <option value="" disabled selected>
                Selecciona tu provincia
              </option>
              <option value="buenos-aires">Buenos Aires</option>
              <option value="cordoba">Córdoba</option>
              <option value="mendoza">Mendoza</option>
              <option value="santa-fe">Santa Fe</option>
              <option value="otra">Otra / Interior</option>
            </select>
          </div>

          <div class="form-group">
            <label for="mensaje">Mensaje</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="5"
              required
              placeholder="Escribe aquí tu consulta..."
            ></textarea>
          </div>
          <div class="form-group trap-field">
            <label for="honeypot">Si eres humano, deja este campo vacío:</label>
            <input type="text" id="honeypot" autocomplete="off" />
          </div>

          <button type="submit" class="btn-submit primary_button">Enviar</button>

          <div id="formResponse" class="form-response hidden"></div>
        </form>
      </div>
    </section>
    <!-- #endregion -->
  

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const PUBLIC_KEY = "K7-yaV37t-kZm0Rsh";
        const SERVICE_ID = "service_timd9fl";
        const TEMPLATE_ID = "template_ox70ztd";
        emailjs.init(PUBLIC_KEY);
        document
          .getElementById("consultaForm")
          .addEventListener("submit", function (event) {
            event.preventDefault();
            const botTrapValue = document.getElementById("honeypot").value;
            if (botTrapValue !== "") {
              console.warn("Envío bloqueado: Se detectó un posible robot.");
              document.getElementById("consultaForm").reset();
              return;
            }
            const responseDiv = document.getElementById("formResponse");
            const submitButton = document.querySelector(".btn-submit");
            const nombre = document.getElementById("nombre").value.trim();
            const apellido = document.getElementById("apellido").value.trim();
            const email = document.getElementById("email").value.trim();
            const provincia = document.getElementById("provincia").value;
            const mensaje = document.getElementById("mensaje").value.trim();
            submitButton.textContent = "Enviando...";
            submitButton.disabled = true;
            const templateParams = {
              nombre: nombre,
              apellido: apellido,
              email: email,
              provincia: provincia,
              mensaje: mensaje,
            };
            emailjs
              .send(SERVICE_ID, TEMPLATE_ID, templateParams)
              .then(function (response) {
                console.log("¡Éxito!", response.status, response.text);
                responseDiv.textContent = `¡Muchas gracias, ${nombre}! Tu consulta ha sido enviada con éxito.`;
                responseDiv.className = "form-response success";
                document.getElementById("consultaForm").reset();
              })
              .catch(function (error) {
                console.error("Error de EmailJS:", error);
                responseDiv.textContent =
                  "Hubo un problema al enviar tu mensaje. Por favor, inténtalo de nuevo.";
                responseDiv.className = "form-response error";
              })
              .finally(function () {
                submitButton.textContent = "Enviar Consulta";
                submitButton.disabled = false;
                setTimeout(() => {
                  responseDiv.className = "form-response hidden";
                }, 6000);
              });
          });
      });
    </script>

     <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
