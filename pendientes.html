<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Obra Civil - Calculador de niveles por distancia múltiple</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Obra Civil - Calculadora de niveles por distancia en tiempo real para trabajo de campo." />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pendientes.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="pre-loader.js" defer></script>
  </head>

  <!-- #region pre_loader -->
  <div class="preloader-overlay" id="preloader">
    <div class="loader-container">
      <div class="spinner five">
        <div></div><div></div><div></div><div></div><div></div><div></div>
        <div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
    </div>
  </div>
  <!-- #endregion -->

  <!-- #region Header -->
  <header class="main-header">
    <a href="index.html" class="logo">Obra <span>Civil</span></a>
    <div id="main-header-deck" class="header__deck">
      <nav class="nav-bar" aria-label="Navegación principal">
        <ul class="nav-list">
           <li><a href="index.html">Inicio</a></li>
          <li><a href="galeria.html">Obras</a></li>
          <li><a href="javascript:void(0)" class="disabled">Post</a></li>
          <li><a href="consultas.html">Consultas</a></li>
          <li><a href="https://maquetacion77.github.io/maquetacion77" target="_blank">M77</a></li>
         
        </ul>
      </nav>
    </div>
    <button
      id="toggleButton"
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="main-header-deck"
      aria-label="Abrir menú"
    ></button>   
  </header>
  <!-- #endregion -->

  <body>
    <div class="container" id="container">
      <div class="headline">
        <form id="formulario">
         
          <div>
            <div>
              <div class="input-box">
                <input type="number" id="distancia_inicial" value="0">
              </div>
              <label for="distancia_inicial">Distancia inicial:</label>
            </div>
            <div>
              <div class="input-box">
                <input type="number" id="distancia_final" placeholder="Ej: 100">
              </div>
               <label for="distancia_final">Distancia final:</label>
            </div>
            <div>
              <div class="input-box">
                <input type="number" id="nivel_inicial" placeholder="Ej: 50.000">
              </div>
               <label for="nivel_inicial">Nivel inicial:</label>
            </div> 
            <div>
              <div class="input-box">
                <input type="number" id="nivel_final" placeholder="Ej: 52.500">
              </div>
              <label for="nivel_final">Nivel final:</label>
            </div>
          </div>
          
          <!-- Contenedor dinámico para las 10 filas de distancias y salidas -->
          <div id="contenedor_multiples" ></div>
        </form>
      </div>
    </div>

    <!-- #region footer -->
    <footer>
      <p><span>Obra</span><span>Civil</span> creado por Miguel Cortez</p>
    </footer>
    <!-- #endregion -->
    <script src="pendientes.js"></script>
    <script src="toggleButton.js" defer></script>
  </body>
</html>
